[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-libei"
version = "0.4.0"
description = "Inject and receive input on Wayland from Python: ctypes bindings for libei, libeis and liboeffis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Dennis K. Paulsen"}]
keywords = [
    "wayland",
    "libei",
    "libeis",
    "liboeffis",
    "input",
    "input-emulation",
    "emulated-input",
    "portal",
    "xdg-desktop-portal",
    "remote-desktop",
    "automation",
    "gui-testing",
    "accessibility",
    "ctypes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Zero hard dependencies: the native libraries (libei/libeis/liboeffis) are
# loaded lazily via ctypes at first use, not at import time, so this package
# never fails to import just because a caller hasn't installed them. See
# src/libei/_capi/loader.py.
dependencies = []

[project.optional-dependencies]
# libei.portal negotiates the RemoteDesktop portal directly over D-Bus, which
# needs PyGObject for Gio/GLib. The native GObject-introspection libraries
# still have to come from the distro -- PyPI's PyGObject wheel only supplies
# the Python side. Not needed for libei.ei/libei.eis/libei.oeffis.
portal = ["PyGObject>=3.42"]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
homepage = "https://github.com/ctrondlp/python-libei"
repository = "https://github.com/ctrondlp/python-libei"
issues = "https://github.com/ctrondlp/python-libei/issues"
changelog = "https://github.com/ctrondlp/python-libei/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ship the marker so type checkers use our annotations.
[tool.setuptools.package-data]
libei = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the real libei/libeis/liboeffis shared libraries to be installed",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]
strict = true
# ctypes function objects are typed Callable[..., Any] -- there's no way to
# give LazyLibrary.function() a properly parameterized return type without a
# TypeVar per bound function, which the runtime signature can't provide.
# Every property in ei.py/eis.py/oeffis.py re-types a raw C call's result,
# so this fires everywhere in the wrapper layer for no actionable reason.
warn_return_any = false

# PyGObject is an optional extra (see [project.optional-dependencies].portal),
# so `gi` may or may not be importable where mypy runs. Without this, the two
# error codes differ by environment -- import-untyped when PyGObject is
# installed, import-not-found when it isn't -- and an inline ignore pinned to
# either one fails in the other. libei.portal already treats gi as Any.
[[tool.mypy.overrides]]
module = ["gi.*"]
ignore_missing_imports = true
